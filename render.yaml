services:
  - type: web
    name: aide-africa-website
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        value: https://aide-africa-website.onrender.com
      - key: CURRENCY
        value: USD
